version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosimple
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - noctx
    - prealloc
    - revive
    - misspell
    - unconvert
    - unparam

  settings:
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
    errcheck:
      check-type-assertions: true
      check-blank: false
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003"]

  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - "_test.go$"
      - "export_test.go$"
      - "examples/**"
      - "benchmarks/**"
      - "magefiles/**"

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

run:
  timeout: 5m
  modules-download-mode: readonly
  go: "1.25"
